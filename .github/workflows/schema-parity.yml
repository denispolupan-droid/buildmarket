name: Schema parity prod vs test

# Тестова база має збігатися з продом по таблицях і колонках, інакше тести
# перевіряють не те, що працює в проді: 15.10.2026 тест відставав на 14 колонок
# і таблицю, /admin на тесті падав, а інтеграційні тести були зелені.
# Порівнюємо information_schema.columns обох проєктів через Management API
# (секрет SUPABASE_ACCESS_TOKEN) і падаємо з переліком розбіжностей.
#
# 31.10.2026: додано порівняння RLS (увімкнено/ні на таблиці) і політик (ім'я, команда,
# ролі, USING/WITH CHECK). Знахідка того дня: на тесті RLS був вимкнений на 23 таблицях
# і бракувало 30 політик — колонкова перевірка цього не бачила
# (supabase/schema/test-sync-2026-10-31.sql).

on:
  schedule:
    - cron: '0 2 * * *'   # щодня 05:00 за Києвом
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_REF: boaztnparrdoeknajprn
      TEST_REF: mdrextghmuzkyelpqsgp
    steps:
      - name: Compare columns, RLS and policies
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1; }
          QCOLS='{"query":"SELECT table_name, column_name, udt_name, is_nullable FROM information_schema.columns WHERE table_schema='"'"'public'"'"' ORDER BY 1,2"}'
          QRLS='{"query":"SELECT c.relname AS table_name, c.relrowsecurity AS rls FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = '"'"'public'"'"' AND c.relkind IN ('"'"'r'"'"','"'"'p'"'"') ORDER BY 1"}'
          QPOL='{"query":"SELECT tablename, policyname, permissive, cmd, array_to_string(roles, '"'"','"'"') AS roles, coalesce(qual, '"'"''"'"') AS qual, coalesce(with_check, '"'"''"'"') AS with_check FROM pg_policies WHERE schemaname = '"'"'public'"'"' ORDER BY 1,2"}'
          for ref in "$PROD_REF" "$TEST_REF"; do
            curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$ref/database/query" -d "$QCOLS" > "cols-$ref.json"
            curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$ref/database/query" -d "$QRLS" > "rls-$ref.json"
            curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$ref/database/query" -d "$QPOL" > "pol-$ref.json"
          done
          node - <<'EOF'
          const fs = require('fs');
          const load = (kind, ref) => JSON.parse(fs.readFileSync(`${kind}-${ref}.json`));
          const P = process.env.PROD_REF, T = process.env.TEST_REF;
          const report = [];

          // Порівняння двох списків за ключем і «підписом»: що бракує в тесті, що інше, що зайве.
          function compare(label, prod, test, key, sig) {
            const pm = new Map(prod.map(r => [key(r), sig(r)])), tm = new Map(test.map(r => [key(r), sig(r)]));
            for (const k of pm.keys()) {
              if (!tm.has(k)) report.push(`${label} missing in test: ${k} (${pm.get(k)})`);
              else if (tm.get(k) !== pm.get(k)) report.push(`${label} differs: ${k} prod=${pm.get(k)} test=${tm.get(k)}`);
            }
            for (const k of tm.keys()) if (!pm.has(k)) report.push(`${label} only in test: ${k}`);
            console.log(`${label}: prod ${prod.length}, test ${test.length}`);
          }

          compare('column', load('cols', P), load('cols', T),
            c => `${c.table_name}.${c.column_name}`,
            c => `${c.udt_name}${c.is_nullable === 'NO' ? ' NOT NULL' : ''}`);
          compare('rls', load('rls', P), load('rls', T),
            r => r.table_name, r => r.rls ? 'enabled' : 'disabled');
          compare('policy', load('pol', P), load('pol', T),
            p => `${p.tablename}.${p.policyname}`,
            p => `${p.permissive} ${p.cmd} TO ${p.roles} USING ${p.qual.replace(/\s+/g, ' ')} CHECK ${p.with_check.replace(/\s+/g, ' ')}`);

          if (report.length) {
            for (const r of report) console.log('::error::' + r);
            process.exit(1);
          }
          console.log('✓ schemas, RLS and policies match');
          EOF

      - name: Alert on drift
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] && curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" -d text="⚠️ Схема тестової бази розійшлась із продом (колонки/RLS/політики): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
