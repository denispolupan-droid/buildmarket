name: Sync Rozetka orders

on:
  # schedule:
  #   - cron: '*/15 * * * *'   # кожні 15 хвилин — вимкнено до першого успішного ручного тесту
  workflow_dispatch:           # можна запустити вручну з GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Rozetka orders sync
        run: |
          curl -s -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fixline.com.ua/api/cron/rozetka-orders
