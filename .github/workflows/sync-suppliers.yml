name: Sync suppliers

on:
  schedule:
    - cron: '0 */2 * * *'   # кожні 2 години
  workflow_dispatch:          # можна запустити вручну з GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger supplier sync
        run: |
          curl -s -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fixline.com.ua/api/cron/sync-suppliers
