name: Sync suppliers

on:
  # schedule ВИМКНЕНО: синк постачальників тепер через Supabase pg_cron
  # (задання sync-suppliers-every-2h). Дублювання подвоювало egress Supabase.
  # schedule:
  #   - cron: '0 */2 * * *'
  workflow_dispatch:          # можна запустити вручну з GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger supplier sync
        run: |
          curl -s -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fixline.com.ua/api/cron/sync-suppliers
