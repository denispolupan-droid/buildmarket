name: Nightly full database dump

# Повний дамп бази (схема + дані, усі таблиці) замість CSV семи таблиць через REST
# (backup-db.yml): той не бачить money_entries, acc_document_lines, stock_*,
# партій FIFO — тобто саме обліку. На nano-тарифі Supabase PITR немає, тож цей
# дамп — єдина точка відновлення.
#
# Потрібен секрет SUPABASE_DB_URL — рядок підключення до прода
# (Project Settings → Database → Connection string, режим Session pooler,
# порт 5432, з паролем БД). Артефакт лежить у приватному репозиторії 30 днів.

on:
  schedule:
    - cron: '30 1 * * *'   # щодня 04:30 за Києвом
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client-17

      - name: pg_dump (schema + data, public schema)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$DB_URL" || { echo "::error::SUPABASE_DB_URL secret is not set"; exit 1; }
          mkdir -p dump
          STAMP=$(date -u +%Y%m%d-%H%M)
          pg_dump "$DB_URL" --schema=public --no-owner --no-privileges \
            --format=custom --compress=9 --file "dump/fixline-$STAMP.dump"
          pg_dump "$DB_URL" --schema=public --no-owner --no-privileges \
            --schema-only --file "dump/fixline-$STAMP.schema.sql"
          ls -lh dump/
          # Санітарна перевірка: у дампі мають бути ключові таблиці
          pg_restore --list "dump/fixline-$STAMP.dump" | grep -cE "TABLE DATA public (orders|money_entries|acc_documents|product_stock) " | xargs test 4 -eq

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-dump-${{ github.run_number }}
          path: dump/
          retention-days: 30
          if-no-files-found: error

      - name: Alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] && curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" -d text="🚨 Нічний дамп бази не вдався: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
