name: Nightly full database dump

# Повний дамп бази (схема + дані, усі таблиці) замість CSV семи таблиць через REST
# (backup-db.yml): той не бачить money_entries, acc_document_lines, stock_*,
# партій FIFO — тобто саме обліку. На nano-тарифі Supabase PITR немає, тож цей
# дамп — єдина точка відновлення.
#
# Потрібен секрет SUPABASE_DB_URL — рядок підключення до прода
# (Project Settings → Database → Connection string, режим Session pooler,
# порт 5432, з паролем БД). Артефакт лежить у приватному репозиторії 30 днів;
# недільний — ще й окремим артефактом на 90 днів (більше GitHub не дає).
#
# Аудит 31.10.2026 додав:
#  • дані auth (auth.users / identities): без них після відновлення зникають
#    логіни, ролі персоналу в app_metadata і звʼязок customers.auth_user_id.
#    Схему auth веде сама Supabase, тому зберігаємо лише ДАНІ — вони
#    відновлюються в новий проєкт Supabase, де схема вже є (docs/RESTORE.md);
#  • метадані storage (бакети й записи обʼєктів; самі файли — у Storage/R2);
#  • зашифровану копію поза GitHub у Cloudflare R2. Крок вмикається, щойно
#    заведені секрети: R2_BACKUP_BUCKET, R2_BACKUP_ENDPOINT,
#    R2_BACKUP_ACCESS_KEY_ID, R2_BACKUP_SECRET_ACCESS_KEY, BACKUP_PASSPHRASE.
#    Розшифрування: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in X.enc -out X

on:
  schedule:
    - cron: '30 1 * * *'   # щодня 04:30 за Києвом
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
    steps:
      # Сервер — PostgreSQL 17, а на ubuntu-latest стоїть клієнт 16: pg_dump
      # відмовляється («server version mismatch»). Ставимо 17 з офіційного
      # репозиторію PGDG їхнім же скриптом і кличемо бінарники за повним шляхом,
      # щоб обгортка pg_wrapper не підсунула 16.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: pg_dump (schema + data, public schema)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PG: /usr/lib/postgresql/17/bin
        run: |
          test -n "$DB_URL" || { echo "::error::SUPABASE_DB_URL secret is not set"; exit 1; }
          mkdir -p dump
          STAMP=$(date -u +%Y%m%d-%H%M)
          # Дамп і еталонні лічильники — з ОДНОГО знімка бази. GitHub запускає розклад
          # із запізненням до кількох годин (02.11.2026 — о 10:06 за Києвом, у робочий
          # час): лічильники окремим запитом після дампу бачили документ, проведений
          # за ці хвилини, і перевірка відновлення падала на цілому дампі. Тримаємо
          # відкриту транзакцію REPEATABLE READ, експортуємо її знімок і даємо його
          # pg_dump (--snapshot); лічильники рахуємо в тій самій транзакції.
          coproc SNAP { "$PG/psql" "$DB_URL" -At -q -v ON_ERROR_STOP=1; }
          echo "BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY; SELECT pg_export_snapshot();" >&"${SNAP[1]}"
          read -r -t 60 SNAPSHOT <&"${SNAP[0]}" || { echo "::error::pg_export_snapshot did not answer"; exit 1; }
          echo "snapshot $SNAPSHOT"
          "$PG/pg_dump" "$DB_URL" --schema=public --no-owner --no-privileges --snapshot="$SNAPSHOT" \
            --format=custom --compress=9 --file "dump/fixline-$STAMP.dump"
          "$PG/pg_dump" "$DB_URL" --schema=public --no-owner --no-privileges --snapshot="$SNAPSHOT" \
            --schema-only --file "dump/fixline-$STAMP.schema.sql"
          # Еталон для перевірки відновлення: скільки рядків у тому самому знімку
          echo "SELECT 'orders', count(*) FROM orders
            UNION ALL SELECT 'money_entries', count(*) FROM money_entries
            UNION ALL SELECT 'acc_documents', count(*) FROM acc_documents
            UNION ALL SELECT 'acc_document_lines', count(*) FROM acc_document_lines
            UNION ALL SELECT 'product_stock', count(*) FROM product_stock
            UNION ALL SELECT 'customers', count(*) FROM customers;
            SELECT 'END';" >&"${SNAP[1]}"
          : > dump/counts.txt
          while read -r -t 60 line <&"${SNAP[0]}"; do
            [ "$line" = "END" ] && break
            echo "$line" >> dump/counts.txt
          done
          [ "$line" = "END" ] || { echo "::error::row counts did not arrive"; exit 1; }
          echo "COMMIT;" >&"${SNAP[1]}"
          exec {SNAP[1]}>&-
          wait
          test "$(wc -l < dump/counts.txt)" -eq 6
          cat dump/counts.txt
          ls -lh dump/
          # Санітарна перевірка: у дампі мають бути ключові таблиці з даними
          "$PG/pg_restore" --list "dump/fixline-$STAMP.dump" | grep -cE "TABLE DATA public (orders|money_entries|acc_documents|product_stock) " | xargs test 4 -eq

      - name: pg_dump auth + storage (data only)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PG: /usr/lib/postgresql/17/bin
        run: |
          STAMP=$(ls dump/*.dump | head -1 | sed -E 's#.*fixline-(.*)\.dump#\1#')
          "$PG/pg_dump" "$DB_URL" --data-only --no-owner --no-privileges \
            --table=auth.users --table=auth.identities \
            --format=custom --compress=9 --file "dump/fixline-$STAMP.auth.dump"
          "$PG/pg_dump" "$DB_URL" --data-only --no-owner --no-privileges \
            --table=storage.buckets --table=storage.objects \
            --format=custom --compress=9 --file "dump/fixline-$STAMP.storage.dump"
          "$PG/psql" "$DB_URL" -At -c "SELECT 'auth.users', count(*) FROM auth.users" > dump/auth-counts.txt
          cat dump/auth-counts.txt
          # Санітарна перевірка: користувачі в дампі є
          "$PG/pg_restore" --list "dump/fixline-$STAMP.auth.dump" | grep -q "TABLE DATA auth users"
          ls -lh dump/

      - name: Is it Sunday?
        id: dow
        run: echo "sunday=$([ "$(date -u +%u)" = 7 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-dump-${{ github.run_number }}
          path: dump/
          retention-days: 30
          if-no-files-found: error

      - name: Upload weekly artifact (90 days)
        if: steps.dow.outputs.sunday == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-db-dump-${{ github.run_number }}
          path: dump/
          retention-days: 90
          if-no-files-found: error

      # Копія поза GitHub: якщо втратимо доступ до акаунта чи репозиторію, артефакти
      # зникнуть разом із ним. Шифруємо до вивантаження — у дампі ПДн і гроші.
      - name: Off-site copy to R2 (encrypted)
        if: env.R2_BACKUP_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
          R2_ENDPOINT:           ${{ secrets.R2_BACKUP_ENDPOINT }}
          BACKUP_PASSPHRASE:     ${{ secrets.BACKUP_PASSPHRASE }}
          SUNDAY:                ${{ steps.dow.outputs.sunday }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::BACKUP_PASSPHRASE is not set"; exit 1; }
          KIND=daily; [ "$SUNDAY" = "true" ] && KIND=weekly
          for f in dump/*.dump; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -in "$f" -out "$f.enc"
            aws s3 cp "$f.enc" "s3://$R2_BACKUP_BUCKET/$KIND/$(basename "$f").enc" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done
          aws s3 cp dump/counts.txt "s3://$R2_BACKUP_BUCKET/$KIND/counts-$(date -u +%Y%m%d).txt" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "uploaded to r2://$R2_BACKUP_BUCKET/$KIND/"

  # Бекап, який жодного разу не відновлювали, — не бекап. Розгортаємо дамп у
  # чистий PostgreSQL 17 і звіряємо кількість рядків ключових таблиць з еталоном.
  # Supabase-специфіка (ролі anon/authenticated, auth.uid()/jwt(), auth.users)
  # замінюється заглушками — нас цікавлять дані й схема public, а не їхні ролі.
  restore-test:
    needs: dump
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - uses: actions/download-artifact@v4
        with:
          name: db-dump-${{ github.run_number }}
          path: dump/

      - name: Restore into clean PostgreSQL 17
        env:
          PG: /usr/lib/postgresql/17/bin
          URL: postgresql://postgres:restore@localhost:5432/postgres
        run: |
          "$PG/psql" "$URL" -v ON_ERROR_STOP=1 -c "
            CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;
            CREATE SCHEMA auth;
            CREATE TABLE auth.users (id uuid PRIMARY KEY, email text);
            CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$\$ SELECT NULL::uuid \$\$;
            CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS \$\$ SELECT '{}'::jsonb \$\$;
            CREATE SCHEMA extensions; CREATE EXTENSION IF NOT EXISTS pgcrypto SCHEMA extensions; CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\" SCHEMA extensions;
            ALTER DATABASE postgres SET search_path TO public, extensions;"
          # Відновлюємо лише public: auth/storage — дані для живого проєкту Supabase,
          # у голому PG17 їхньої схеми немає (вміст перевірено в dump через pg_restore --list).
          DUMP=$(ls dump/*.dump | grep -vE '\.(auth|storage)\.dump$')
          # Окремі помилки (напр., FK на auth.users через заглушку) не валять відновлення —
          # далі звіряємо дані, а повний лог лишається в кроці.
          "$PG/pg_restore" --dbname "$URL" --no-owner --no-privileges --jobs 2 "$DUMP" 2> restore.log || true
          echo "restore errors: $(grep -c 'ERROR' restore.log || true)"
          grep 'ERROR' restore.log | sed 's/^/  /' | head -40 || true

      - name: Compare row counts with production
        env:
          PG: /usr/lib/postgresql/17/bin
          URL: postgresql://postgres:restore@localhost:5432/postgres
        run: |
          fail=0
          while IFS='|' read -r table expected; do
            got=$("$PG/psql" "$URL" -At -c "SELECT count(*) FROM public.$table")
            if [ "$got" = "$expected" ]; then echo "✓ $table: $got"; else echo "::error::$table: restored $got, expected $expected"; fail=1; fi
          done < dump/counts.txt
          exit $fail

      - name: Alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] && curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" -d text="🚨 Нічний дамп бази не вдався: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
