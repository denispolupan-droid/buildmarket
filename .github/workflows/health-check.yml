name: Health check

on:
  schedule:
    - cron: '0 */2 * * *'   # Кожні 2 години
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site availability
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://fixline.com.ua)
          echo "Site status: $STATUS"
          # Accept 2xx (OK) and 3xx (redirect to www — normal behaviour)
          if [[ ! "$STATUS" =~ ^[23] ]]; then
            echo "::error::Site is DOWN! HTTP $STATUS"
            exit 1
          fi

      - name: Check supplier sync freshness
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Захищений роут на проді сам читає час останнього синку (зі своїм service-role)
          # і алертить у Telegram, якщо застаріло. Тут — падаємо (→ лист), якщо не 200.
          CODE=$(curl -s -o /tmp/sync_body -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://fixline.com.ua/api/cron/supplier-sync-status)
          echo "HTTP $CODE"; cat /tmp/sync_body; echo ""
          if [ "$CODE" != "200" ]; then
            echo "::error::Синк постачальників застряг або роут недоступний (HTTP $CODE)"
            exit 1
          fi

      - name: Report success
        run: echo "✓ All checks passed at $(date -u)"
