name: Sync Prom orders

on:
  # schedule:
  #   - cron: '*/15 * * * *'   # кожні 15 хвилин — вимкнено (Prom пробний період закінчився)
  workflow_dispatch:           # можна запустити вручну з GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Prom orders sync
        run: |
          curl -s -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fixline.com.ua/api/cron/prom-orders
