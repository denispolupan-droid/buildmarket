name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Unit tests + type check — на кожен push/PR ───────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

  # ── Production build — ловить помилки рендера/конфігурації до прода ───────────
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          # Фіктивний ключ: роути створюють new Resend(...) на рівні модуля, і
          # «Collecting page data» падає без ключа. Білд листів не відправляє.
          RESEND_API_KEY: re_dummy_ci_build_only
        run: npm run build

  # ── Integration tests — автоматично при push в main, вручну на PR ─────────────
  integration:
    name: Integration tests (DB)
    runs-on: ubuntu-latest
    needs: unit
    # На push в main — завжди. На PR — тільки якщо є секрети (не fork).
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    concurrency:
      group: integration-tests
      cancel-in-progress: false   # не скасовуємо — чекаємо завершення (БД спільна)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Integration tests
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
        run: npm run test:integration

      # ── E2E адмінки: підтвердити → відвантажити → доставити, правка позицій,
      # скасування, запобіжник «Відправлено без РН» — через справжні роути під
      # сесією e2e-адміна тестової бази. Той самий job, бо база спільна з
      # інтеграційними (concurrency group вище).
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E admin
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          E2E_ADMIN_PASSWORD:            ${{ secrets.E2E_ADMIN_PASSWORD }}
          RESEND_API_KEY: re_dummy_ci_build_only
        run: npm run test:e2e:admin

      - name: Upload admin e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-admin
          path: playwright-report-admin/
          retention-days: 7

      - name: Verify DB invariants
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SERVICE_KEY:  ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESULT=$(curl -s \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "apikey: $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/check_invariants")
          echo "$RESULT" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print('\nDB Invariants:')
          for r in data:
              icon = '✓' if r['status'] == 'OK' else '✗'
              print(f'  {icon} {r[\"invariant\"]}')
              if r['status'] != 'OK':
                  print(f'    → {r[\"details\"]}')
          fails = [r for r in data if r['status'] == 'FAIL']
          sys.exit(len(fails))
          "
