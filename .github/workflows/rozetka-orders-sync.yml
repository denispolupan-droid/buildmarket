# Синхронізація замовлень Rozetka.
# Розклад ВИМКНЕНО: частий синк тепер через Supabase pg_cron (задання
# rozetka-orders-sync). Раніше тут був обхід добового ліміту Vercel Hobby, але
# pg_cron робить те саме — два тригери подвоювали роботу й egress Supabase.
# Ручний запуск лишаємо (workflow_dispatch).
name: Rozetka orders sync

on:
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -m 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://fixline.com.ua/api/cron/rozetka-orders")
          BODY=$(echo "$RESPONSE" | head -n -1)
          CODE=$(echo "$RESPONSE" | tail -n 1)
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "200" ] || exit 1
