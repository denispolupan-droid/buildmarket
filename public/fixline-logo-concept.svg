<svg viewBox="0 0 195 46" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fixline concept">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4880B8"/>
      <stop offset="100%" stop-color="#3DBFB8"/>
    </linearGradient>
  </defs>

  <!--
    fl лігатура:
    – лівий стовп (f)
    – верхня горизонталь (вигин f → геометрична лінія, спільна для f і l)
    – середня перекладина f, яка тягнеться до l (буквально "line")
    – правий стовп (l, починається від перекладини)
  -->

  <!-- f: лівий стовп -->
  <rect x="0" y="8" width="7" height="38" rx="3.5" fill="url(#grad)"/>
  <!-- f: верхня горизонталь (з'єднує f і l вгорі) -->
  <rect x="0" y="8" width="35" height="7" rx="3.5" fill="url(#grad)"/>
  <!-- f→l: перекладина — це і є "line" в назві -->
  <rect x="0" y="23" width="35" height="6" rx="3" fill="url(#grad)"/>
  <!-- l: правий стовп (починається від перекладини) -->
  <rect x="28" y="23" width="7" height="23" rx="3.5" fill="url(#grad)"/>

  <!-- Wordmark -->
  <text
    x="50" y="37"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="26"
    letter-spacing="-0.8"
    fill="#1E3A5F"
  ><tspan font-weight="700">fix</tspan><tspan font-weight="300">line</tspan></text>
</svg>
