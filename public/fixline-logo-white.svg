<svg viewBox="0 0 195 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FIXLINE">
  <title>fixline</title>

  <!-- Icon: three bars -->
  <rect x="0" y="0"  width="32" height="7" rx="2" fill="#4880B8"/>
  <rect x="0" y="12" width="23" height="7" rx="2" fill="#ffffff"/>
  <rect x="0" y="24" width="15" height="7" rx="2" fill="#ffffff"/>

  <!-- Thin accent line -->
  <rect x="41" y="2" width="1.5" height="26" rx="1" fill="#4880B8" opacity="0.5"/>

  <!-- Wordmark -->
  <text
    x="51"
    y="31"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="800"
    letter-spacing="-1"
    fill="#ffffff"
  >fixline</text>
</svg>
