<svg viewBox="0 0 168 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FIXLINE">
  <title>FIXLINE</title>
  <defs>
    <linearGradient id="gw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7EB8E8"/>
      <stop offset="100%" stop-color="#5DD8D0"/>
    </linearGradient>
  </defs>

  <!-- Icon: three bars -->
  <rect x="0" y="1"  width="26" height="5" rx="2" fill="url(#gw)"/>
  <rect x="0" y="11" width="18" height="4" rx="2" fill="#ffffff"/>
  <rect x="0" y="20" width="11" height="4" rx="2" fill="#ffffff"/>

  <!-- Wordmark -->
  <text
    x="34"
    y="27"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="23"
    font-weight="600"
    letter-spacing="-0.3"
    fill="url(#gw)"
  >fix</text>
  <text
    x="73"
    y="27"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="23"
    font-weight="800"
    letter-spacing="-0.3"
    fill="#ffffff"
  >line</text>
</svg>
