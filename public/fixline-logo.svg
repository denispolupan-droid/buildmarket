<svg viewBox="0 0 180 42" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fixline">
  <title>fixline</title>

  <!-- Icon: three fully-rounded bars -->
  <rect x="0" y="4"  width="30" height="7" rx="3.5" fill="#4880B8"/>
  <rect x="0" y="16" width="22" height="7" rx="3.5" fill="#1E3A5F" class="logo-dark"/>
  <rect x="0" y="28" width="14" height="7" rx="3.5" fill="#1E3A5F" class="logo-dark"/>

  <!-- Separator -->
  <rect x="40" y="5" width="1.5" height="28" rx="1" fill="#4880B8" opacity="0.25"/>

  <!-- fix: light weight -->
  <text
    x="50" y="36"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="42" font-weight="300" letter-spacing="-1"
    fill="#1E3A5F" class="logo-dark"
  >fix</text>

  <!-- line: bold weight -->
  <text
    x="111" y="36"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="42" font-weight="700" letter-spacing="-1"
    fill="#1E3A5F" class="logo-dark"
  >line</text>
</svg>
